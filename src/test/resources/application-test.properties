# Integration test profile. The datasource URL is supplied at runtime by
# PostgresTestBase via @DynamicPropertySource.

# Deterministic, test-only signing key. The application refuses to start without
# one, which is the behaviour under test elsewhere.
app.jwt.secret=test-only-secret-key-at-least-32-bytes-long-for-hs256-padding

# No Gemini calls are made during context loading; the models are built lazily
# from this placeholder.
gemini.api.key=test-key-not-used

# Rate limiting off by default so functional tests are not throttled. The
# limiter has its own dedicated tests that enable it explicitly.
app.ratelimit.enabled=false

logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
