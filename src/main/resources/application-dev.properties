# Development profile: activate with -Dspring.profiles.active=dev
#
# Verbose SQL logging lives here rather than in the default profile, where it
# would also apply in production and log every statement the application runs.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.jtspringproject=DEBUG

# Convenience only. Never rely on this default outside local development.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-key-change-me-32bytes-minimum}
