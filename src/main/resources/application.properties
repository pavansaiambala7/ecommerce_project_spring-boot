# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=8080

# Never leak stack traces or internal exception text to clients.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
# Credentials come from the environment. The defaults exist so a local
# docker-compose run works out of the box, and must not be used anywhere else.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommjava}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate

# Off deliberately. With OSIV enabled, lazy associations are silently initialised
# during view rendering, which hides N+1 queries behind the template layer.
# Read paths that need an association fetch it explicitly via @EntityGraph.
spring.jpa.open-in-view=false

# hibernate.enable_lazy_load_no_trans was removed: it masks
# LazyInitializationException by opening a short-lived session per access,
# turning one missing fetch join into an unbounded number of queries.

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# baseline-on-migrate is off: against a non-empty database it silently skips V1
# and the application then fails ddl-auto=validate with a confusing error.
# Set it explicitly when adopting Flyway on a database that predates it.
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# Authentication (JWT)
# ---------------------------------------------------------------------------
# No default: the application refuses to start without this rather than run with
# a signing key that is public knowledge. Generate one with, for example:
#   openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.jwt.issuer=jtspringproject

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
app.cors.allow-credentials=true
app.cors.max-age-seconds=3600

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------
app.ratelimit.enabled=true
# Only enable when a trusted proxy overwrites X-Forwarded-For. Otherwise callers
# set it themselves and mint a fresh identity per request.
app.ratelimit.trust-forwarded-for=${RATELIMIT_TRUST_XFF:false}
app.ratelimit.max-tracked-clients=100000

# ---------------------------------------------------------------------------
# AI chat sessions
# ---------------------------------------------------------------------------
app.chat.max-sessions=10000
app.chat.session-ttl-minutes=60

# ---------------------------------------------------------------------------
# Gemini
# ---------------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
# embedding-001 and gemini-pro are retired names. gemini-embedding-001 is the
# current embedding model.
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
# gemini-2.0-flash was retired and returns 404, which is what broke the chat
# assistant. Fallbacks are tried in order whenever a model fails, so the next
# retirement - or a 503 "high demand", which was seen from two models at once
# while testing - degrades to a slower answer instead of no answer. All three
# verified against the live API on 2026-09-17; gemini-2.5-flash-lite, the
# obvious light choice, already refuses new users.
gemini.chat.model=${GEMINI_CHAT_MODEL:gemini-3.6-flash}
gemini.chat.fallback-models=${GEMINI_CHAT_FALLBACK_MODELS:gemini-2.5-flash,gemini-3.1-flash-lite}
gemini.chat.max-output-tokens=4096

# ---------------------------------------------------------------------------
# pgvector
# ---------------------------------------------------------------------------
# Must match the vector(...) width of product.embedding. gemini-embedding-001
# returns 3072 dimensions by default, so GeminiConfig passes this value as the
# model's outputDimensionality; changing it means rebuilding every vector, since
# embeddings of different widths cannot be compared. Move this and the column
# definition in V2/V9 together.
pgvector.dimension=768

# ---------------------------------------------------------------------------
# Catalogue
# ---------------------------------------------------------------------------
# Pause between embedding batches. 0 relies on backing off when Gemini reports
# a quota error; raise it to stay under a known per-minute limit instead.
app.embedding.batch-delay-ms=${EMBEDDING_BATCH_DELAY_MS:0}
# Search suggestions are rebuilt after every import; this refresh catches
# products edited one at a time in between.
app.search.suggestion-refresh-ms=900000
# How far a vector match may be before it stops counting as a match at all.
# Nearest-neighbour search always returns something; without this, a query with
# no real match is answered with whatever happened to be closest.
app.search.max-vector-distance=0.40

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.jtspringproject=INFO

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
# Only health is exposed. The default set includes endpoints that leak the
# whole configuration, every bean and the environment - including resolved
# property values - which is a gift to anyone probing the host.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Liveness and readiness are separate questions. Liveness asks "is this JVM
# broken" and readiness asks "can it serve traffic yet" - during startup the
# app is alive but not ready, and a load balancer needs to tell those apart
# rather than killing a container that is still migrating the schema.
management.endpoint.health.probes.enabled=true

# The database is the one dependency the app cannot serve without, so its
# health belongs in the readiness answer. This line is load-bearing: the
# readiness group defaults to readinessState alone, which reports UP even with
# the datasource down - verified by stopping the database and watching the
# probe stay green. Liveness deliberately excludes it, because a dead database
# is not a reason to restart the JVM.
management.endpoint.health.group.readiness.include=readinessState,db
management.health.db.enabled=true

# ---------------------------------------------------------------------------
# Razorpay
# ---------------------------------------------------------------------------
# Blank by default so the application starts without them: local work and the
# test suite have no gateway credentials, and failing to boot over a missing
# payment key would be a poor trade. RazorpayGateway checks for them and
# refuses gateway calls with a clear message rather than a null pointer.
#
# keyId is public and reaches the browser. keySecret must not - it is what
# makes a payment signature impossible to forge. webhookSecret is separate so
# that rotating one does not invalidate the other.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=${RAZORPAY_CURRENCY:INR}

# Razorpay retries any webhook not answered 2xx, and a duplicate must not be
# processed twice. Raising this only affects how long delivered events are
# kept for reconciliation, not whether duplicates are caught - that is the
# primary key on razorpay_webhook_event.
