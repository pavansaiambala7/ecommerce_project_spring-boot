# Builds and deploys the storefront.
#
# Why this exists alongside the Jenkinsfile: the Jenkins host is a 2 GB t3.small
# that also runs Jenkins itself, and building this image needs Node, Maven and
# the Docker daemon at once. It could not do both, and the free account plan
# does not allow a bigger instance. GitHub's runners build it in a few minutes
# for nothing, so the build moves here and the server only ever pulls and runs.
#
# No AWS keys are stored: the job assumes an IAM role through GitHub's OIDC
# provider, scoped to this repository. Deployment goes through Systems Manager
# rather than SSH, so no port 22 rule and no private key are needed either.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Deploy without running the test suite
        type: boolean
        default: false

concurrency:
  # One deploy at a time; a newer push supersedes one that is still queued.
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: ecommerce-app
  APP_INSTANCE_TAG: ecommerce-app

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets cannot be read in a step's `if`, so the check becomes an env value.
      HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Testcontainers needs a Docker daemon, which ubuntu-latest has. The
      # tests start their own PostgreSQL with pgvector, so no service container
      # is declared here.
      - name: Test
        if: ${{ !inputs.skip_tests }}
        run: ./mvnw -B verify

      - name: Publish test results
        if: ${{ always() && !inputs.skip_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Explain the missing role
        if: env.HAS_AWS_ROLE != 'true'
        run: |
          echo "::warning::AWS_ROLE_ARN is not set, so this run stopped after the tests."
          echo "Create the role (deploy/README.md section 13), add its ARN as the"
          echo "AWS_ROLE_ARN repository secret, then re-run this workflow."

      - name: Assume AWS role
        if: env.HAS_AWS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: env.HAS_AWS_ROLE == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: env.HAS_AWS_ROLE == 'true'
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to the app host
        if: env.HAS_AWS_ROLE == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail

          INSTANCE=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$APP_INSTANCE_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "app instance: $INSTANCE"

          # The deploy scripts and compose file are fetched from this exact
          # commit, so the host runs the scripts that belong to the image it is
          # about to start - not whatever was copied there last time.
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          COMMANDS=$(jq -nc --arg raw "$RAW" --arg image "$IMAGE" --arg region "$AWS_REGION" '
            [ "set -e",
              "sudo mkdir -p /opt/ecommerce/deploy && cd /opt/ecommerce/deploy",
              "for f in deploy.sh fetch-secrets.sh backup.sh restore.sh healthcheck.sh; do sudo curl -fsSL -o $f \($raw)/deploy/$f; done",
              "sudo curl -fsSL -o docker-compose.prod.yml \($raw)/docker-compose.prod.yml",
              "sudo chmod +x /opt/ecommerce/deploy/*.sh",
              "sudo /opt/ecommerce/deploy/deploy.sh \($image) \($region)" ]')

          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters "commands=$COMMANDS" \
            --query 'Command.CommandId' --output text)
          echo "ssm command: $CMD"

          # Poll rather than sleep: a deploy that finishes in forty seconds
          # should not cost five minutes of runner time.
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
              *) sleep 10 ;;
            esac
          done

          echo "--- deploy output ---"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
            --query 'StandardOutputContent' --output text
          ERR=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
            --query 'StandardErrorContent' --output text)
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "--- stderr ---"
            echo "$ERR"
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy finished with status $STATUS. deploy.sh rolls the host back to the last working image on a failed smoke test - check the output above."
            exit 1
          fi
          echo "deployed $IMAGE"
