name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit & integration tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy-test-key' }}
          # Test-only signing key. The application refuses to start without one,
          # which is the intended behaviour.
          JWT_SECRET: ci-only-secret-key-at-least-32-bytes-long-for-hs256-padding
        run: ./mvnw -B clean verify

      - name: Upload JaCoCo Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
